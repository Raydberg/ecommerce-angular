<h1 class="text-2xl font-bold">{{ product().name }}</h1>
<div class="divider"></div>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">Datos generales</h2>


    <fieldset class="fieldset">
      <legend class="fieldset-legend">Nombre</legend>
      <input type="text" placeholder="Nombre" class="input input-bordered w-full" formControlName="name"
        [class.border-red-500]="productForm.get('name')?.errors ?? false" />
      <form-error-label [control]="productForm.get('name')!" />
    </fieldset>


    <fieldset class="fieldset">
      <legend class="fieldset-legend">Slug</legend>
      <input formControlName="slug" type="text" placeholder="Slug" class="input input-bordered w-full"
        [class.border-red-500]="productForm.get('slug')?.errors ?? false" />
      <form-error-label [control]="productForm.get('slug')!" />
    </fieldset>


    <fieldset class="fieldset">
      <legend class="fieldset-legend">Descripcion</legend>
      <textarea class="textarea textarea-bordered" placeholder="Descripción" rows="6" formControlName="description"
        [class.border-red-500]="productForm.get('description')?.errors ?? false"></textarea>

      <form-error-label [control]="productForm.get('description')!" />
    </fieldset>




    <h2 class="text-lg font-bold">Datos de venta</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <div class="">

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Precio</legend>
          <input type="number" placeholder="Precio" class="input input-bordered w-full" formControlName="price"
            [class.border-red-500]="productForm.get('price')?.errors ?? false" />
          <form-error-label [control]="productForm.get('price')!" />
        </fieldset>


      </div>

      <fieldset class="fieldset">
        <legend class="fieldset-legend">Stock</legend>
        <input type="number" placeholder="Inventario" class="input input-bordered w-full" formControlName="stock"
          [class.border-red-500]="productForm.get('stock')?.errors ?? false" />
        <form-error-label [control]="productForm.get('stock')!" />
      </fieldset>

    </div>


    <fieldset class="fieldset">
      <legend class="fieldset-legend">Tags</legend>
      <!-- tags -->
      <input type="text" formControlName="tags" placeholder="Tags" class="input input-bordered w-full" />
    </fieldset>


    <!-- Botones para el género -->
    <fieldset>
      <legend class="my-2">Genero</legend>
      <div class="grid grid-cols-4 gap-2">
        <button type="button" class="btn btn-sm" [class.btn-primary]="productForm.value.gender == 'MEN'"
          (click)="productForm.patchValue({gender: 'MEN' })">Masculino</button>
        <button type="button" class="btn btn-sm" [class.btn-accent]="productForm.value.gender == 'WOMEN'"
          (click)="productForm.patchValue({gender: 'WOMEN' })">Femenino</button>
        <button type="button" class="btn btn-sm " [class.btn-warning]="productForm.value.gender == 'KID'"
          (click)="productForm.patchValue({gender: 'KID' })">Kid</button>
        <button type="button" class="btn btn-sm" [class.btn-secondary]="productForm.value.gender == 'UNISEX'"
          (click)="productForm.patchValue({gender: 'UNISEX' })">Unisex</button>

        <!-- <button class="btn btn-sm btn-outline">Masculino</button> -->
      </div>
    </fieldset>

    <!-- <select class="select select-bordered w-full">
      <option value="male">Masculino</option>
      <option value="female">Femenino</option>
      <option value="unisex">Unisex</option>
    </select> -->

    <!-- Sizes -->

    <fieldset>
      <legend>Tamaño</legend>
      <div class="grid grid-cols-6 gap-2">
        @for (size of sizes; track size) {
        <button class="btn btn-sm " [class.btn-secondary]="productForm.value.sizes?.includes(size)"
          (click)="onSizeChange(size)" type="button">{{ size }}</button>
        }
      </div>
    </fieldset>

  </div>

  <!-- Imágenes -->
  <div class="flex flex-col gap-2">
    <div class="flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->

        Guardar
      </button>
    </div>

    <product-carousel [images]="product().images" />

    <input (change)="onFileChange($event)" type="file" class="file-input file-input-bordered w-full mt-4" />

    @if (imagePreview() && imagePreview()!.length >0) {

    <div class="mt-6 flex flex-wrap gap-4">
      @for (imagePreview of imagePreview(); track $index) {
      <div class="relative w-40 h-40 group">
        <img [src]="imagePreview" alt="Preview" class="w-full h-full object-cover rounded-xl border border-base-300" />
        <button type="button"
        (click)="removeNewImage($index)"
        class="btn btn-circle btn-sm btn-error absolute -top-2 -right-2 opacity-0 group-hover:opacity-100 transition-opacity shadow-lg"
        

        >
          <ng-icon name="heroTrash" />
        </button>
      </div>
      }
    </div>

    }

  </div>
  <pre>
    {{ productForm.value | json }}
  </pre>
</form>
